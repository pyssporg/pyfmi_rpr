name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # pyfmi-interop is a public release asset; pysos-rpr is a release asset
        # in a private repository, so installing it needs a token that can read
        # that repository. Without the secret the job stays green: the public
        # half installs normally and the two distribution checks skip with a
        # visible reason instead of failing the run.
        env:
          PYSSP_TOKEN: ${{ secrets.PYSSP_READ_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$PYSSP_TOKEN" ]; then
            python -m pip install \
              "pysos-rpr @ https://x-access-token:${PYSSP_TOKEN}@github.com/pyssporg/pysos_rpr/releases/download/v0.1.0/pysos_rpr-0.1.0-py3-none-any.whl"
            python -m pip install -e ".[dev]"
          else
            echo "::warning::PYSSP_READ_TOKEN is not set; the private pysos-rpr wheel is not installed and its checks will skip"
            python -m pip install --no-deps -e ".[dev]"
            python -m pip install \
              "pyfmi-interop @ https://github.com/pyssporg/pyfmi_interop/releases/download/v0.3.0/pyfmi_interop-0.3.0-py3-none-linux_x86_64.whl" \
              "protobuf>=5.29,<6" "pytest>=8" "ruff>=0.6"
          fi

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest
