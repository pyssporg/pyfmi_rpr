name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # Both siblings are public release assets pinned to immutable URLs in
        # pyproject.toml, so the resolver fetches them anonymously. The RPR
        # tests are a required part of this job, not an optional extra.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Confirm the pinned siblings are installed
        run: |
          python -c "import importlib.metadata as m; print('pysos-rpr', m.version('pysos-rpr')); print('pyfmi-interop', m.version('pyfmi-interop'))"
          python -c "import pysos_rpr.messages, pyfmi_interop.wire"

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest
