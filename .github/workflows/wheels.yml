name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check the declared sibling pins
        # The release artifact is what consumers resolve; a pin that is not in
        # the wheel metadata is not a pin. Only the immutable URLs are checked
        # here, because they are the part that must never drift.
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("pyfmi_rpr-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = archive.read(name).decode("utf-8")
          expected = [
              "Requires-Dist: pyfmi-interop @ https://github.com/pyssporg/pyfmi_interop/releases/download/v0.3.0/pyfmi_interop-0.3.0-py3-none-linux_x86_64.whl",
              "Requires-Dist: pysos-rpr @ https://github.com/pyssporg/pysos_rpr/releases/download/v0.1.0/pysos_rpr-0.1.0-py3-none-any.whl",
          ]
          for line in expected:
              assert line in metadata, line
          PY

      - name: Smoke test the wheel
        # The smoke venv installs the wheel without dependency resolution so
        # the import check proves that importing pyfmi_rpr does not pull in
        # the vocabulary. Both pinned siblings are public.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install \
            "pyfmi-interop @ https://github.com/pyssporg/pyfmi_interop/releases/download/v0.3.0/pyfmi_interop-0.3.0-py3-none-linux_x86_64.whl"
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import sys
          import pyfmi_rpr
          assert pyfmi_rpr.__version__ == "0.1.0"
          assert "pysos_rpr" not in sys.modules
          PY

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(/tmp/smoke/bin/python -c "import pyfmi_rpr; print(pyfmi_rpr.__version__)")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match built version ${version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
